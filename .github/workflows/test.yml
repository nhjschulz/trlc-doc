name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Only ruff, the version range comes from the lint extra in pyproject.toml.
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['lint'][0])")"

      - name: Run ruff
        run: ruff check --output-format=github .

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PlantUML needs a Java runtime to render the diagrams of the HTML site tests.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The tests download the PlantUML jar into the pytest cache once.
      - name: Cache PlantUML
        uses: actions/cache@v4
        with:
          path: .pytest_cache/d/plantuml
          key: plantuml-${{ hashFiles('trlcdoc/plantuml.py') }}

      # doxygen is needed by the C/C++ tracing test (lobster-doxygen extractor).
      - name: Install doxygen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install doxygen (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install doxygen.install -y --no-progress
          echo "C:\Program Files\doxygen\bin" >> $env:GITHUB_PATH

      - name: Install trlcdoc with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run tests
        run: pytest -v --cov=trlcdoc --cov-report=term
