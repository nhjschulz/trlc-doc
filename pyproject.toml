[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "trlcdoc"
version = "0.3.0"
requires-python = ">=3.10"
description = "Configurable documentation tooling for TRLC based projects"
readme = "PYPI.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "trlcdoc/converters/LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
authors = [
  {name = "Norbert Schulz", email = "github@schulznorbert.de"}
]

dependencies = [
  "PyYAML >= 6.0",
  "jsonschema >= 4.18",
  # pyTRLCConverter determines the trlc version.
  "pyTRLCConverter >= 3.0.0",
  "bmw-lobster == 1.0.*",
  "Sphinx >= 8.1.3",
  "myst-parser >= 4.0.0",
  "sphinxcontrib-plantuml >= 0.30"
]

[project.optional-dependencies]
test = [
  "pytest >= 8.0",
  "pytest-cov >= 5.0"
]
doc = [
  "sphinx_rtd_theme == 3.1.0"
]

[project.urls]
Documentation = "https://nhjschulz.github.io/trlc-doc/"
Repository = "https://github.com/nhjschulz/trlc-doc"

[project.scripts]
trlcdoc = "trlcdoc.cli:main"

[tool.setuptools.packages.find]
include = ["trlcdoc*"]
namespaces = true

[tool.setuptools.package-data]
trlcdoc = ["schema/*.json", "converters/*", "sphinx/*.py", "sphinx/_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
