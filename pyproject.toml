[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "trlcdoc"
version = "0.2.0"
requires-python = ">=3.10"
description = "Configurable documentation tooling for TRLC based projects"
readme = "PYPI.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "trlcdoc/converters/LICENSE"]
authors = [
  {name = "Norbert Schulz", email = "norbert.schulz@newtec.de"},
  {name = "Andreas Merkle", email = "andreas.merkle@newtec.de"}
]

dependencies = [
  "PyYAML >= 6.0",
  "jsonschema >= 4.18",
  # pyTRLCConverter determines the trlc version.
  "pyTRLCConverter >= 3.0.0",
  "bmw-lobster == 1.0.*",
  "Sphinx >= 8.1.3",
  "myst-parser >= 4.0.0",
  "sphinxcontrib-plantuml >= 0.30"
]

[project.optional-dependencies]
test = [
  "pytest >= 8.0",
  "pytest-cov >= 5.0"
]

[project.urls]
Documentation = "https://nhjschulz.github.io/trlc-doc/"
Repository = "https://github.com/nhjschulz/trlc-doc"

[project.scripts]
trlcdoc = "trlcdoc.cli:main"

[tool.setuptools.packages.find]
include = ["trlcdoc*"]
namespaces = true

[tool.setuptools.package-data]
trlcdoc = ["schema/*.json", "converters/*", "sphinx/*.py", "sphinx/_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
