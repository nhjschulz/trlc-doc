[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trlcdoc"
version = "0.1.0"
requires-python = ">=3.10"
description = "Configurable documentation tooling for TRLC based projects"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Norbert Schulz", email = "norbert.schulz@newtec.de"}
]

dependencies = [
  "PyYAML >= 6.0",
  "jsonschema >= 4.18",
  # pyTRLCConverter determines the trlc version.
  "pyTRLCConverter >= 3.0.0",
  "bmw-lobster == 1.0.*",
  "Sphinx >= 8.1.3",
  "myst-parser >= 4.0.0",
  "sphinxcontrib-plantuml >= 0.30"
]

[project.optional-dependencies]
test = [
  "pytest >= 8.0",
  "pytest-cov >= 5.0"
]

[project.urls]
Repository = "https://github.com/nhjschulz/trlc-doc"

[project.scripts]
trlcdoc = "trlcdoc.cli:main"

[tool.setuptools]
packages = ["trlcdoc"]

[tool.setuptools.package-data]
trlcdoc = ["schema/*.json", "converters/*", "sphinx/*.py", "sphinx/_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
