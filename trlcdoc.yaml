# yaml-language-server: $schema=trlcdoc/schema/trlcdoc.schema.json
#
# trlcdoc configuration of trlcdoc itself: builds requirements, architecture,
# tests, test results, tracing report and the HTML site.
#
#   pip install -e .[test,doc]
#   trlcdoc            # all steps, HTML site in build/trlcdoc/html

project:
  name: trlcdoc
  version: "0.3.0"
  author: Norbert Schulz
  copyright: "2026, Norbert Schulz"
  repository: https://github.com/nhjschulz/trlc-doc.git

paths:
  trlc_model: trlc/model
  output: build/trlcdoc

documents:
  - id: trlcdoc_readme
    title: About trlcdoc
    type: markdown
    source: README.md

  - id: configuration
    title: Configuration Reference
    type: markdown
    source: configuration.md
    placeholders: false  # the page explains the {project_root} placeholder

  - id: sw_requirements
    title: SW-Requirements
    type: trlc
    source: trlc/swe-req
    pytrlcconverter:
      converter:
        rst: builtin:req2rst.py
        markdown: builtin:req2markdown.py
      translation: builtin:translation.json
      render_cfg: builtin:renderCfg.json


  - id: sw_architecture
    title: SW-Architecture
    type: trlc
    source: trlc/swe-arch
    include: [sw_requirements]
    pytrlcconverter:
      converter:
        rst: builtin:req2rst.py
        markdown: builtin:req2markdown.py
      translation: builtin:translation.json
      render_cfg: builtin:renderCfg.json

  - id: sw_test
    title: SW-Tests
    type: trlc
    source: trlc/swe-test
    include: [sw_requirements]
    pytrlcconverter:
      converter:
        rst: builtin:tc2rst.py
        markdown: builtin:tc2markdown.py
      translation: builtin:translation.json
      render_cfg: builtin:renderCfg.json

  - id: sw_test_results
    title: SW-Test Results
    type: test_results
    include: [sw_test]
    pytrlcconverter:
      converter:
        rst: builtin:create_test_report_in_rst.py
        markdown: builtin:create_test_report_in_markdown.py

  - id: sw_tracing_report
    title: Software Tracing Report
    type: trace_report

  - id: coverage_report
    title: Coverage Report
    type: html
    source: tests:coverage

  - id: license
    title: License information
    type: text
    source: LICENSE

tests:
  runner: pytest
  args: [tests, -v, --cov=trlcdoc]
  link:
    from: "test_{name}"
    to: "SwTests.tc_{name}"

trace:
  namespace: req
  levels:
    - name: SW Requirement
      document: sw_requirements
      record_type: SwRequirements.SwReq
      requires: [SW Architecture, SW Code, SW Test Case]

    - name: SW Constraint
      document: sw_requirements
      record_type: SwRequirements.SwConstraint
      requires: [SW Architecture]

    - name: SW Architecture
      document: sw_architecture
      record_type: SwArch.SwArchSpec
      tags: [satisfies]
      trace_to: [SW Requirement, SW Constraint]

    - name: SW Code
      kind: implementation
      extractor: lobster-python
      sources: [trlcdoc]
      trace_to: [SW Requirement]

    - name: SW Test Case
      document: sw_test
      record_type: SwTests.SwTestCase
      tags: [verifies]
      trace_to: [SW Requirement]
      requires: [SW Test Result]

    - name: SW Test Result
      document: sw_test_results
      record_type: SwTests.SwTestCaseResult
      tags: [relates]
      description_fields: [name]
      trace_to: [SW Test Case]

plantuml:
  version: 1.2024.8

html:
  extensions:
    - sphinx_rtd_theme
  theme: sphinx_rtd_theme
  conf: doc/sphinx/sphinx_conf.py
