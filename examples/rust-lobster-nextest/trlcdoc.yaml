# yaml-language-server: $schema=../../trlcdoc/schema/trlcdoc.schema.json
#
# trlcdoc configuration of the Rust greeter example: requirements, architecture,
# test cases, test results, tracing report and coverage.
#
#   trlcdoc            # all steps, HTML site in build/trlcdoc/html
#   trlcdoc all show   # ... and open it in the web browser
#
# Not yet traced: the Rust code. trlcdoc has no lobster-rust extractor yet, so
# the levels SW Code and SW Test Code are missing, see README.md.

project:
  name: Greeter
  author: NewTec GmbH
  copyright: "2025, NewTec GmbH"

paths:
  trlc_model: trlc/model
  output: build/trlcdoc

documents:
  - id: readme
    title: About the Example
    type: markdown
    source: README.md

  - id: sw_requirements
    title: SW-Requirements
    type: trlc
    source: trlc/swe-req
    pytrlcconverter:
      converter:
        rst: builtin:req2rst.py
        markdown: builtin:req2markdown.py
      translation: builtin:translation.json

  - id: sw_architecture
    title: SW-Architecture
    type: trlc
    source: trlc/swe-arch
    include: [sw_requirements]
    pytrlcconverter:
      converter:
        rst: builtin:req2rst.py
        markdown: builtin:req2markdown.py
      translation: builtin:translation.json

  - id: sw_test
    title: SW-Tests
    type: trlc
    source: trlc/swe-test
    include: [sw_requirements]
    pytrlcconverter:
      converter:
        rst: builtin:tc2rst.py
        markdown: builtin:tc2markdown.py
      translation: builtin:translation.json

  - id: sw_test_results
    title: SW-Test Results
    type: test_results
    include: [sw_test]
    pytrlcconverter:
      converter:
        rst: builtin:create_test_report_in_rst.py
        markdown: builtin:create_test_report_in_markdown.py

  - id: sw_tracing_report
    title: SW-Tracing Report
    type: trace_report

  - id: coverage_report
    title: Coverage Report
    type: html
    source: tests:coverage

  - id: license
    title: License
    type: text
    source: LICENSE

# cargo-llvm-cov runs the unit tests with cargo-nextest and coverage. The nextest
# profile "ci" (.config/nextest.toml) writes the JUnit report with the output of
# every test. lobster_trace!() in each test writes "lobster-trace: <test case>"
# to it. A test may record several test cases, so the result records relate to
# a list.
tests:
  runner: command
  command: [cargo, llvm-cov, nextest, --profile, ci, --html]
  junit: target/nextest/ci/junit.xml
  coverage: target/llvm-cov/html
  link:
    output: "lobster-trace: {id}"
    array: true

trace:
  namespace: req
  levels:
    - name: SW Requirement
      document: sw_requirements
      record_type: SwRequirements.SwReq
      requires: [SW Architecture, SW Test Case]

    - name: SW Constraint
      document: sw_requirements
      record_type: SwRequirements.SwConstraint
      requires: [SW Architecture]

    - name: SW Architecture
      document: sw_architecture
      record_type: SwArch.SwArchSpec
      tags: [satisfies]
      trace_to: [SW Requirement, SW Constraint]

    - name: SW Test Case
      document: sw_test
      record_type: SwTests.SwTestCase
      tags: [verifies]
      trace_to: [SW Requirement]
      requires: [SW Test Result]

    - name: SW Test Result
      document: sw_test_results
      record_type: SwTests.SwTestCaseResult
      tags: [relates]
      description_fields: [name]
      trace_to: [SW Test Case]
