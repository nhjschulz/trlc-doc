# yaml-language-server: $schema=../../trlcdoc/schema/trlcdoc.schema.json
#
# trlcdoc configuration of the C++ greeter example: requirements, architecture,
# test cases, googletest results, tracing report, detail design and coverage.
#
#   trlcdoc            # all steps, HTML site in build/trlcdoc/html
#   trlcdoc all show   # ... and open it in the web browser

project:
  name: Greeter
  author: NewTec GmbH
  copyright: "2025, NewTec GmbH"

paths:
  trlc_model: trlc/model
  output: build/trlcdoc

documents:
  - id: readme
    title: About the Example
    type: markdown
    source: README.md

  - id: sw_requirements
    title: SW-Requirements
    type: trlc
    source: trlc/swe-req
    pytrlcconverter:
      converter:
        rst: builtin:req2rst.py
        markdown: builtin:req2markdown.py
      translation: builtin:translation.json

  - id: sw_architecture
    title: SW-Architecture
    type: trlc
    source: trlc/swe-arch
    include: [sw_requirements]
    pytrlcconverter:
      converter:
        rst: builtin:req2rst.py
        markdown: builtin:req2markdown.py
      translation: builtin:translation.json

  - id: sw_detail_design
    title: SW-Detail Design
    type: command
    command: [doxygen, Doxyfile]
    output: build/doxygen/html

  - id: sw_test
    title: SW-Tests
    type: trlc
    source: trlc/swe-test
    include: [sw_requirements]
    pytrlcconverter:
      converter:
        rst: builtin:tc2rst.py
        markdown: builtin:tc2markdown.py
      translation: builtin:translation.json

  - id: sw_test_results
    title: SW-Test Results
    type: test_results
    include: [sw_test]
    pytrlcconverter:
      converter:
        rst: builtin:create_test_report_in_rst.py
        markdown: builtin:create_test_report_in_markdown.py

  - id: sw_tracing_report
    title: SW-Tracing Report
    type: trace_report

  - id: coverage_report
    title: Coverage Report
    type: html
    source: tests:coverage

  - id: license
    title: License
    type: text
    source: LICENSE

# CMake builds and runs the googletest tests with coverage. LOBSTER_TRACE() in
# each test records its TRLC test case as property "lobster-tracing" in the
# googletest XML report.
tests:
  runner: command
  command: [cmake, -P, tools/run_tests.cmake]
  junit: build/test/greet_test.xml
  coverage: build/test/coverage
  link:
    property: lobster-tracing

trace:
  namespace: req
  levels:
    - name: SW Requirement
      document: sw_requirements
      record_type: SwRequirements.SwReq
      requires: [SW Architecture, SW Code, SW Test Case]

    - name: SW Constraint
      document: sw_requirements
      record_type: SwRequirements.SwConstraint
      requires: [SW Architecture]

    - name: SW Architecture
      document: sw_architecture
      record_type: SwArch.SwArchSpec
      tags: [satisfies]
      trace_to: [SW Requirement, SW Constraint]

    - name: SW Code
      kind: implementation
      extractor: lobster-doxygen
      doxyfile: Doxyfile
      trace_to: [SW Requirement]

    - name: SW Test Case
      document: sw_test
      record_type: SwTests.SwTestCase
      tags: [verifies]
      trace_to: [SW Requirement]
      requires: [SW Test Code, SW Test Result]

    - name: SW Test Code
      kind: implementation
      extractor: lobster-doxygen
      doxyfile: test/Doxyfile
      trace_to: [SW Test Case]

    - name: SW Test Result
      document: sw_test_results
      record_type: SwTests.SwTestCaseResult
      tags: [relates]
      description_fields: [name]
      trace_to: [SW Test Case]
